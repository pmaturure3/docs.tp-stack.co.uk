site_name: TP Stack Documentation
site_url: https://docs.tp-stack.co.uk

theme:
  name: material
  logo: assets/tp-stack-logo-purple.png
  favicon: assets/tp-stack-logo-purple.png
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - search.suggest
    - content.code.copy

markdown_extensions:
  - pymdownx.snippets:
      base_path: !relative
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/custom.css

nav:
  - Welcome: "index.md"
  - TP Stack:
      - "tp-stack/index.md"
      - "tp-stack/platforms.md"
      - "tp-stack/clusters.md"
      - "tp-stack/hardware.md"
      - "tp-stack/storage.md"
  - Connecting to TP Stack:
      - "connecting/index.md"
      - "connecting/ssh.md"
      - "connecting/jupyterlab.md"
      - "connecting/vscode.md"
  - Running Jobs:
      - "running-jobs/index.md"
      - "running-jobs/slurm.md"
      - "running-jobs/job-scripts.md"
  - Environments:
      - "environments/index.md"
      - "environments/python.md"
      - "environments/conda.md"
  - Building and Installing Software:
      - "software/index.md"
      - "software/building.md"
      - "software/installing.md"
